<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para los dos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap');

  :root{
    --pink: #e78ea1;
    --pink-dark: #c76277;
    --pink-light: #ffe6ec;
    --green: #7a9b7e;
    --cream: #fff8f5;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins', sans-serif;
    background: #fff url('fondo.jpg') center bottom / cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- Pantalla inicial ---------- */
  #opening{
    position:fixed;
    inset:0;
    background:#d4a1d2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    text-align:center;
    z-index:5;
    padding:16px;
  }

  #openingImg{
    max-height:64vh;
    max-width:90vw;
    width:auto;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(120,40,110,0.3);
  }

  #pressBtn{
    background: #c2399f;
    color:white;
    border:none;
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 1.3rem;
    font-family:'Poppins', sans-serif;
    cursor:pointer;
    box-shadow: 0 10px 25px rgba(160,44,133,0.4);
    transition: transform .2s ease, background .3s ease;
    animation: pulse 1.8s infinite;
  }
  #pressBtn:hover{ transform: scale(1.06); background: #a02c85; }

  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(194,57,159,0.5); }
    50%{ box-shadow: 0 0 0 18px rgba(194,57,159,0); }
  }

  #openingSub{
    margin-top:0;
    color: #7a1f66;
    font-size:1rem;
    opacity:0.85;
    min-height:1.4em;
  }

  /* ---------- Carta ---------- */
  #letter{
    display:none;
    width:100%;
    max-width: 950px;
    margin: 30px;
    background: var(--cream);
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(150,60,80,0.25);
    padding: 40px 30px;
    position:relative;
    animation: fadeUp 1.2s ease forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(40px); }
    to{ opacity:1; transform: translateY(0); }
  }

  h1.title{
    text-align:center;
    font-family:'Dancing Script', cursive;
    font-size: 2.6rem;
    color: var(--pink-dark);
    margin: 0 0 4px 0;
  }

  #letterBody{
    display:flex;
    gap: 30px;
    align-items:flex-start;
  }

  #flowerSide{
    flex: 0 0 220px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  #flowerSide.ready{ cursor:pointer; }
  #flowerSide.ready svg{ animation: sway 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway{ 0%,100%{ transform: rotate(-3deg); } 50%{ transform: rotate(3deg); } }
  .divider{ display:block; width:100%; max-width:460px; height:auto; margin:0 auto 26px; }

  #textSide{
    flex:1;
    font-size: 1.08rem;
    line-height: 1.9;
    color:#5a3d42;
    white-space: pre-wrap;
    min-height: 320px;
  }

  #textSide .cursor{
    display:inline-block;
    width: 2px;
    background: var(--pink-dark);
    margin-left:2px;
    animation: blink 0.8s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- Corazones flotantes ---------- */
  .heart{
    position:fixed;
    bottom:-40px;
    font-size: 1.4rem;
    color: var(--pink);
    opacity:0.7;
    animation: floatUp linear forwards;
    pointer-events:none;
    z-index:1;
  }
  @keyframes floatUp{
    to{ transform: translateY(-110vh) translateX(var(--drift,0px)) rotate(360deg); opacity:0; }
  }

  @media (max-width: 720px){
    #letterBody{ flex-direction: column; align-items:center; }
    #flowerSide{ flex:none; margin-bottom:10px; }
    h1.title{ font-size: 1.9rem; }
  }
</style>
</head>
<body>

<div id="hearts"></div>

<div id="opening">
  <img id="openingImg" src="amor.png" alt="love">
  <button id="pressBtn">Aprieta 💌</button>
  <div id="openingSub"></div>
</div>

<div id="letter">
  <h1 class="title">Para los dos</h1>
  <img class="divider" src="adorno.png" alt="">
  <div id="letterBody">
    <div id="flowerSide">
      <svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <!-- tallo -->
        <path d="M100 220 C 95 180, 105 160, 100 130" stroke="#7a9b7e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- hojas -->
        <path d="M100 170 C 80 165, 70 150, 78 140 C 92 145, 100 158, 100 170 Z" fill="none" stroke="#7a9b7e" stroke-width="2.5"/>
        <path d="M100 155 C 120 150, 130 135, 122 125 C 108 130, 100 143, 100 155 Z" fill="none" stroke="#7a9b7e" stroke-width="2.5"/>
        <!-- ramo de rosas -->
        <g stroke="#c76277" stroke-width="2.2" fill="none">
          <circle cx="100" cy="80" r="26"/>
          <path d="M100 80 m-14,-6 a10,10 0 1,0 20,0 a8,8 0 1,1 -14,8"/>
          <circle cx="65" cy="95" r="20"/>
          <path d="M65 95 m-11,-5 a8,8 0 1,0 16,0 a6,6 0 1,1 -11,6"/>
          <circle cx="135" cy="95" r="20"/>
          <path d="M135 95 m-11,-5 a8,8 0 1,0 16,0 a6,6 0 1,1 -11,6"/>
          <circle cx="80" cy="55" r="17"/>
          <path d="M80 55 m-9,-4 a7,7 0 1,0 14,0 a5,5 0 1,1 -9,5"/>
          <circle cx="120" cy="55" r="17"/>
          <path d="M120 55 m-9,-4 a7,7 0 1,0 14,0 a5,5 0 1,1 -9,5"/>
          <circle cx="100" cy="40" r="15"/>
          <path d="M100 40 m-8,-4 a6,6 0 1,0 13,0 a4,4 0 1,1 -8,4"/>
        </g>
        <!-- hojitas del ramo -->
        <g fill="none" stroke="#7a9b7e" stroke-width="2">
          <path d="M55 80 C 45 75, 45 65, 55 60 C 60 68, 58 76, 55 80Z"/>
          <path d="M145 80 C 155 75, 155 65, 145 60 C 140 68, 142 76, 145 80Z"/>
          <path d="M100 20 C 92 15, 92 8, 100 5 C 106 10, 105 17, 100 20Z"/>
        </g>
        <!-- listón -->
        <path d="M78 105 Q100 118 122 105" stroke="#c76277" stroke-width="2.5" fill="none"/>
      </svg>
    </div>
    <div id="textSide"></div>
  </div>
</div>

<!-- Reproductor oculto de YouTube -->
<div style="position:fixed; width:1px; height:1px; overflow:hidden; opacity:0;">
  <iframe id="ytPlayer" width="1" height="1"
    src=""
    title="Labios Rotos - Zoé"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
</div>

<script>
const pressBtn = document.getElementById('pressBtn');
const openingSub = document.getElementById('openingSub');
const opening = document.getElementById('opening');
const letter = document.getElementById('letter');
const ytPlayer = document.getElementById('ytPlayer');

let stage = 0;

pressBtn.addEventListener('click', () => {
  stage++;
  if(stage === 1){
    pressBtn.textContent = 'Sigue apretando...';
    openingSub.textContent = '';
    // La musica empieza ya en el primer clic, saltando la intro (cambia start=18 para ajustar los segundos)
    ytPlayer.src = 'https://www.youtube.com/embed/7h2ryr_uUEs?autoplay=1&start=18';
  } else if(stage >= 2){
    // Transicion
    opening.style.transition = 'opacity .6s ease';
    opening.style.opacity = '0';
    setTimeout(() => {
      opening.style.display = 'none';
      letter.style.display = 'block';
      startTypewriter();
    }, 600);
  }
});

// Textos en dos fases
const textoFase1 = `La vida es como una flor de loto, siempre nos sorprende con algo bonito.
Esther Marali, coincidir contigo hoy fue una gran sorpresa.
Apenas nos acabamos de conocer, pero me dio mucho gusto hablar contigo,
espero que nos llevemos muy bien :)`;

const textoFase2 = `Por cierto, puse esto por si crees que esto era para alguien más.

Estás algo loquita, pero aun así te quiero.`;

const textSide = document.getElementById('textSide');
const flowerSide = document.getElementById('flowerSide');
let phase = 0, typing = false;

function typeText(text, done){
  typing = true;
  textSide.innerHTML = '<span id="typed"></span><span class="cursor">&nbsp;</span>';
  const typed = document.getElementById('typed');
  let i = 0;
  (function tick(){
    if(i < text.length){
      typed.textContent += text.charAt(i++);
      setTimeout(tick, 28);
    } else {
      typing = false;
      if(done) done();
    }
  })();
}

function startTypewriter(){
  phase = 1;
  typeText(textoFase1, () => {
    flowerSide.classList.add('ready');
  });
}

// Al tocar las flores, cambia al segundo mensaje
flowerSide.addEventListener('click', () => {
  if(phase !== 1 || typing) return;
  phase = 2;
  flowerSide.classList.remove('ready');
  typeText(textoFase2);
});

// Corazones flotantes
function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = ['💗','💕','🌸','🌷'][Math.floor(Math.random()*4)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.setProperty('--drift', (Math.random()*80-40)+'px');
  h.style.animationDuration = (5 + Math.random()*4) + 's';
  document.getElementById('hearts').appendChild(h);
  setTimeout(() => h.remove(), 10000);
}
setInterval(spawnHeart, 700);
</script>

</body>
</html>
